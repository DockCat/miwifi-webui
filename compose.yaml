name: miwifi-webui

services:
  postgres:
    # Pinned by digest so a rebuilt image cannot silently differ.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: miwifi-webui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miwifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miwifi-secret}
      POSTGRES_DB: ${POSTGRES_DB:-miwifi}
    # Loopback-only: the API reaches postgres over the compose network; the
    # host port exists only for local development (pnpm db:migrate, tests).
    # Remove this mapping entirely for a pure compose deployment.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miwifi} -d ${POSTGRES_DB:-miwifi}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: highwall777/miwifi-webui-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: miwifi-webui-api
    restart: unless-stopped
    # Docker-level healthcheck mirrors the image's HEALTHCHECK.
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DATABASE_URL: postgres://${POSTGRES_USER:-miwifi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-miwifi}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY must be set}
      API_PORT: 3001
      # Bind all interfaces inside the container; exposure is governed by the
      # ports mapping below. Keep web->api on the compose network, and only
      # publish the API port if you deliberately want direct API LAN access.
      API_HOST: 0.0.0.0
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      RETENTION_TELEMETRY_DAYS: ${RETENTION_TELEMETRY_DAYS:-90}
      RETENTION_PRESENCE_DAYS: ${RETENTION_PRESENCE_DAYS:-365}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      RETENTION_INVESTIGATION_DAYS: ${RETENTION_INVESTIGATION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    image: highwall777/miwifi-webui-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: miwifi-webui-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # nginx-unprivileged listens on 8080 inside the container.
    ports:
      - "${WEB_PORT:-5173}:8080"

volumes:
  postgres-data:
