name: miwifi-webui

services:
  postgres:
    image: postgres:17-alpine
    container_name: miwifi-webui-postgres
    restart: unless-stopped
    environment:
      # Development defaults; override for any real deployment.
      POSTGRES_USER: ${POSTGRES_USER:-miwifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miwifi-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-miwifi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miwifi} -d ${POSTGRES_DB:-miwifi}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
