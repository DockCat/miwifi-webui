<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6D00"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
  </defs>
  
  <!-- Cat ears (triangles on top) -->
  <path d="M12 28 L8 8 L22 20 Z" fill="url(#bodyGrad)"/>
  <path d="M52 28 L56 8 L42 20 Z" fill="url(#bodyGrad)"/>
  
  <!-- Inner ear highlights -->
  <path d="M13 25 L11 12 L20 21 Z" fill="#FFB74D"/>
  <path d="M51 25 L53 12 L44 21 Z" fill="#FFB74D"/>
  
  <!-- Main body (rounded rectangle like Mi logo) -->
  <rect x="8" y="22" width="48" height="36" rx="8" ry="8" fill="url(#bodyGrad)"/>
  
  <!-- Cat eyes -->
  <ellipse cx="22" cy="34" rx="4" ry="5" fill="#212121"/>
  <ellipse cx="42" cy="34" rx="4" ry="5" fill="#212121"/>
  
  <!-- Eye highlights -->
  <circle cx="20" cy="32" r="1.5" fill="#FFFFFF"/>
  <circle cx="40" cy="32" r="1.5" fill="#FFFFFF"/>
  
  <!-- Cat nose -->
  <path d="M32 40 L30 43 L34 43 Z" fill="#212121"/>
  
  <!-- Cat mouth -->
  <path d="M32 43 Q28 47 24 44" stroke="#212121" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M32 43 Q36 47 40 44" stroke="#212121" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="6" y1="38" x2="18" y2="40" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="42" x2="18" y2="42" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="46" x2="18" y2="44" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="38" x2="46" y2="40" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="42" x2="46" y2="42" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="46" x2="46" y2="44" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
  
  <!-- "mi" text (Xiaomi branding) -->
  <text x="32" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mi</text>
</svg>
