name: Catter Implement

on:
  workflow_call:
    inputs:
      request_id: { required: true, type: string }
      installation_id: { required: true, type: string }
      repository_id: { required: true, type: string }
      project_item_id: { required: true, type: string }
      issue_number: { required: true, type: string }
      config_sha: { required: true, type: string }
      existing_pr_number: { required: false, type: string }
      existing_pr_branch: { required: false, type: string }
      existing_pr_head_sha: { required: false, type: string }
      agent_model: { required: false, type: string }
      fix_cycle_log: { required: false, type: string }
    secrets:
      opencode_api_key:
        required: false

permissions: {}

jobs:
  opencode-implement:
    name: OpenCode Implement (read-only provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
    env:
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_ID: ${{ inputs.repository_id }}
      REQUEST_ID: ${{ inputs.request_id }}
      INSTALLATION_ID: ${{ inputs.installation_id }}
      PROJECT_ITEM_ID: ${{ inputs.project_item_id }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      CONFIG_SHA: ${{ inputs.config_sha }}
      AGENT_MODEL: ${{ inputs.agent_model }}
      FIX_CYCLE_LOG: ${{ inputs.fix_cycle_log }}
      STATE: /tmp/catter-implementation
    steps:
      - name: Initialize bounded provider state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE"
          mkdir -p "$STATE/artifact"
          printf '%s\n' '{"status":"failure","schema_version":1,"phase":"implement","request_id":"invalid","error_code":"provider_not_run"}' > "$STATE/artifact/result.json"
          : > "$STATE/artifact/patch.diff"
          printf '2\n' > "$STATE/provider-exit"
          printf '0\n' > "$STATE/provider-duration"
          printf 'unchecked\n' > "$STATE/provider-key"

      - name: Validate existing PR identity
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXISTING_PR_NUMBER: ${{ inputs.existing_pr_number }}
          EXISTING_PR_BRANCH: ${{ inputs.existing_pr_branch }}
          EXISTING_PR_HEAD_SHA: ${{ inputs.existing_pr_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXISTING_PR_NUMBER:-}" && -z "${EXISTING_PR_BRANCH:-}" && -z "${EXISTING_PR_HEAD_SHA:-}" ]]; then
            exit 0
          fi
          if [[ -z "${EXISTING_PR_NUMBER:-}" || -z "${EXISTING_PR_BRANCH:-}" || -z "${EXISTING_PR_HEAD_SHA:-}" ]]; then
            echo "existing PR identity partially provided" >&2
            exit 1
          fi
          if [[ ! "$EXISTING_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid existing PR number" >&2
            exit 1
          fi
          if [[ ! "$EXISTING_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid existing PR head SHA" >&2
            exit 1
          fi
          if [[ ! "$EXISTING_PR_BRANCH" =~ ^catter/implement/issue-${ISSUE_NUMBER}-[0-9a-f]{16}$ ]]; then
            echo "invalid existing PR branch" >&2
            exit 1
          fi

      - name: Validate agent model
        env:
          AGENT_MODEL: ${{ inputs.agent_model }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_MODEL:-}" ]]; then
            exit 0
          fi
          trimmed=$(echo "$AGENT_MODEL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ -z "$trimmed" ]]; then
            exit 0
          fi
          if [[ ${#trimmed} -gt 80 ]]; then
            echo "invalid agent model: length exceeds 80" >&2
            exit 1
          fi
          bare="$trimmed"
          if [[ "$bare" =~ ^opencode/(.*)$ ]]; then
            bare="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$bare" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "invalid agent model: format violation" >&2
            exit 1
          fi

      - name: Resolve trusted repository and default base
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROJECT_ITEM_ID" =~ ^[A-Za-z0-9_:-]{1,255}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$CONFIG_SHA" =~ ^[0-9a-f]{40}$ ]]
          repo=$(gh api "repos/$REPOSITORY" --jq '{id,full_name,default_branch}')
          base_branch=$(printf '%s' "$repo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["default_branch"])')
          repo_id=$(printf '%s' "$repo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          repo_name=$(printf '%s' "$repo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["full_name"])')
          [[ "$repo_id" == "$REPOSITORY_ID" && "$repo_name" == "$REPOSITORY" ]]
          [[ "$base_branch" =~ ^[A-Za-z0-9._/-]{1,255}$ && "$base_branch" != *..* ]]
          base_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/$base_branch" --jq '.object.sha')
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          config_status=$(python3 - "$STATE/config-compare.json" "$REPOSITORY" "$CONFIG_SHA" "$base_sha" <<'PY'
          import json
          import os
          import re
          import selectors
          import subprocess
          import sys
          import time
          from pathlib import Path

          output, repository, config_sha, base_sha = sys.argv[1:]
          MAX_BYTES = 262144
          SHA = re.compile(r"[0-9a-f]{40}")

          def fail(message):
              try:
                  Path(output).unlink()
              except OSError:
                  pass
              raise SystemExit(message)

          process = subprocess.Popen(
              ["gh", "api", f"repos/{repository}/compare/{config_sha}...{base_sha}"],
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              start_new_session=True,
          )
          selector = selectors.DefaultSelector()
          selector.register(process.stdout, selectors.EVENT_READ)
          chunks = []
          total = 0
          deadline = time.monotonic() + 30
          try:
              os.set_blocking(process.stdout.fileno(), False)
              while selector.get_map():
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      process.kill()
                      process.wait(timeout=5)
                      fail("compare request timeout")
                  for key, _ in selector.select(min(0.2, remaining)):
                      chunk = os.read(key.fileobj.fileno(), min(65536, MAX_BYTES + 1 - total))
                      if not chunk:
                          selector.unregister(key.fileobj)
                          continue
                      chunks.append(chunk)
                      total += len(chunk)
                      if total > MAX_BYTES:
                          process.kill()
                          process.wait(timeout=5)
                          fail("compare response too large")
          except (OSError, subprocess.SubprocessError):
              try:
                  process.kill()
                  process.wait(timeout=5)
              except (OSError, subprocess.SubprocessError):
                  pass
              fail("compare request failed")
          finally:
              selector.close()
          if process.wait(timeout=5) != 0:
              fail("compare request failed")

          data = b"".join(chunks)
          if len(data) > MAX_BYTES:
              fail("compare response too large")
          try:
              value = json.loads(data.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              fail("invalid compare response")
          if not isinstance(value, dict) or len(value) > 32:
              fail("invalid compare response shape")
          status = value.get("status")
          if status not in {"ahead", "identical"}:
              fail("invalid compare status")
          expected_fields = [("base_commit", config_sha), ("merge_base_commit", config_sha)]
          for field, expected in expected_fields:
              commit = value.get(field)
              if not isinstance(commit, dict) or len(commit) > 32 or not SHA.fullmatch(str(commit.get("sha", ""))) or commit["sha"] != expected:
                  fail(f"invalid compare {field}")
          if status == "ahead":
              head_sha = (value.get("commits") or [{}])[-1].get("sha") or (value.get("head_commit") or {}).get("sha")
              if head_sha != base_sha:
                  fail("invalid compare head_commit")
          for field in ("ahead_by", "behind_by", "total_commits"):
              if field in value and (type(value[field]) is not int or value[field] < 0 or value[field] > 10000000):
                  fail("invalid compare bounds")
          for field in ("commits", "files"):
              if field in value and (not isinstance(value[field], list) or len(value[field]) > 1000):
                  fail("invalid compare bounds")
          Path(output).write_bytes(data)
          print(status)
          PY
          )
          python3 - "$STATE/authority.json" "$repo_id" "$repo_name" "$base_branch" "$base_sha" "$CONFIG_SHA" "$ISSUE_NUMBER" "$REQUEST_ID" "$INSTALLATION_ID" "$PROJECT_ITEM_ID" "$config_status" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output, repo_id, repo, branch, base, config, issue, request, installation, project_item, config_status = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", base) or not re.fullmatch(r"[0-9a-f]{40}", config):
              raise SystemExit("invalid trusted SHA")
          if config_status not in {"ahead", "identical"}:
              raise SystemExit("captured config is not an ancestor of default base")
          identity = json.dumps({"repository_id": int(repo_id), "repository_full_name": repo, "base_branch": branch}, sort_keys=True, separators=(",", ":")).encode()
          Path(output).write_text(json.dumps({
              "schema_version": 1,
              "phase": "implement",
              "request_id": request,
              "installation_id": int(installation),
              "project_item_id": project_item,
              "repository_id": int(repo_id),
              "repository_full_name": repo,
              "repository_sha256": hashlib.sha256(identity).hexdigest(),
              "issue_number": int(issue),
              "config_sha": config,
              "base_sha": base,
              "base_branch": branch,
              "config_compare_status": config_status,
              "config_provenance": "ancestor_or_equal",
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Select provider base ref
        id: base
        if: ${{ steps.identity.outcome == 'success' }}
        env:
          DEFAULT_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          EXISTING_PR_HEAD_SHA: ${{ inputs.existing_pr_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEFAULT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid default base SHA" >&2
            exit 1
          fi
          if [[ -n "${EXISTING_PR_HEAD_SHA:-}" ]]; then
            if [[ ! "$EXISTING_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "invalid existing PR head SHA" >&2
              exit 1
            fi
            selected_base_sha="$EXISTING_PR_HEAD_SHA"
            repair_head_sha="$EXISTING_PR_HEAD_SHA"
          else
            selected_base_sha="$DEFAULT_BASE_SHA"
            repair_head_sha=""
          fi
          python3 - "$STATE/authority.json" "$DEFAULT_BASE_SHA" "$repair_head_sha" "$selected_base_sha" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          authority_path, default_base, repair_head, selected_base = sys.argv[1:]
          if os.path.exists(authority_path):
              authority = json.loads(Path(authority_path).read_text(encoding="utf-8"))
          else:
              authority = {}
          authority["selected_base_sha"] = selected_base
          authority["base"] = {
              "default_base_sha": default_base,
              "repair_head_sha": repair_head if repair_head else None,
          }
          Path(authority_path).write_text(json.dumps(authority, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          printf 'selected_base_sha=%s\n' "$selected_base_sha" >> "$GITHUB_OUTPUT"
          printf 'default_base_sha=%s\n' "$DEFAULT_BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'repair_head_sha=%s\n' "$repair_head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout complete trusted repository
        if: ${{ steps.identity.outcome == 'success' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.base.outputs.selected_base_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify checkout has no persisted credential
        if: ${{ steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$(python3 -c 'import json; a = json.load(open("'"$STATE/authority.json"'")); print(a.get("selected_base_sha", a.get("base_sha")))')"
          if git -C "$GITHUB_WORKSPACE" config --local --get-regexp '^credential\.' >/dev/null 2>&1; then
            echo 'checkout credential helper present' >&2
            exit 1
          fi
          remote=$(git -C "$GITHUB_WORKSPACE" config --local --get remote.origin.url || true)
          case "$remote" in *://*:*@*) echo 'checkout remote contains credentials' >&2; exit 1;; esac
          printf '%s\n' '{"checkout_credential_present":false}' > "$STATE/checkout.json"

      - name: Install exact OpenCode CLI and package pins
        id: cli
        if: ${{ steps.identity.outcome == 'success' }}
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/catter-opencode-npm-cache
          CLI_VERSION: 1.18.18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catter-opencode-package" "$RUNNER_TEMP/catter-opencode-prefix"
          for package in opencode-ai opencode-linux-x64 opencode-linux-x64-baseline; do
            npm view "$package@$CLI_VERSION" version dist.integrity dist.tarball --json > "$RUNNER_TEMP/$package-registry.json"
            npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/catter-opencode-package" "$package@$CLI_VERSION" > "$RUNNER_TEMP/$package-pack.json"
          done
          python3 - \
            "$RUNNER_TEMP/opencode-ai-registry.json" "$RUNNER_TEMP/opencode-ai-pack.json" \
            "$RUNNER_TEMP/opencode-linux-x64-registry.json" "$RUNNER_TEMP/opencode-linux-x64-pack.json" \
            "$RUNNER_TEMP/opencode-linux-x64-baseline-registry.json" "$RUNNER_TEMP/opencode-linux-x64-baseline-pack.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = {
              "opencode-ai": ("sha512-J+5HFq8tf+wPBBpBpMPSNjSytF2/EkNWYfFZh4si1d9auFbQriqDyqZv+vFUsLWERfdMU32Eajwuiq3rKBvZLQ==", "https://registry.npmjs.org/opencode-ai/-/opencode-ai-1.18.18.tgz"),
              "opencode-linux-x64": ("sha512-WmeUnhljYJ252wywKTiW4bNDzsas2njpjPUEh0jM6HKNI4vFxJtREtzaWViY4AKEAcOkLWT8Ll17ixvcHz3AnA==", "https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.18.18.tgz"),
              "opencode-linux-x64-baseline": ("sha512-6GvFarhP0pDiXcE9Au8PWoqb9+ZLBIGKrhZxeVAmOJp/gJ8lLL1Eno8O1qpqRb1KjOfOaOD71jHu9xNaqmjEtw==", "https://registry.npmjs.org/opencode-linux-x64-baseline/-/opencode-linux-x64-baseline-1.18.18.tgz"),
          }
          for package, registry_path, pack_path in zip(expected, sys.argv[1::2], sys.argv[2::2]):
              registry = json.loads(Path(registry_path).read_text(encoding="utf-8"))
              packed = json.loads(Path(pack_path).read_text(encoding="utf-8"))
              integrity, tarball = expected[package]
              if registry.get("version") != "1.18.18" or registry.get("dist.integrity") != integrity or registry.get("dist.tarball") != tarball:
                  raise SystemExit(f"published npm pin changed for {package}")
              if not isinstance(packed, list) or len(packed) != 1 or packed[0].get("integrity") != integrity or packed[0].get("filename") != f"{package}-1.18.18.tgz":
                  raise SystemExit(f"packed npm pin changed for {package}")
          PY
          npm install --prefix "$RUNNER_TEMP/catter-opencode-prefix" --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/catter-opencode-package/opencode-ai-$CLI_VERSION.tgz" \
            "$RUNNER_TEMP/catter-opencode-package/opencode-linux-x64-$CLI_VERSION.tgz" \
            "$RUNNER_TEMP/catter-opencode-package/opencode-linux-x64-baseline-$CLI_VERSION.tgz"
          test "$("$RUNNER_TEMP/catter-opencode-prefix/node_modules/.bin/opencode" --version)" = "$CLI_VERSION"
          test "$(node -p "require('$RUNNER_TEMP/catter-opencode-prefix/node_modules/opencode-linux-x64/package.json').version")" = "$CLI_VERSION"
          test "$(node -p "require('$RUNNER_TEMP/catter-opencode-prefix/node_modules/opencode-linux-x64-baseline/package.json').version")" = "$CLI_VERSION"

      - name: Prepare workspace dependencies
        if: ${{ steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/package.json" ]]; then
            if [[ -f "$GITHUB_WORKSPACE/package-lock.json" ]]; then
              npm ci --prefix "$GITHUB_WORKSPACE" --no-audit --no-fund --ignore-scripts || true
            else
              npm install --prefix "$GITHUB_WORKSPACE" --no-audit --no-fund --package-lock=false --ignore-scripts || true
            fi
          fi

      - name: Fetch and validate default configuration
        id: config
        if: ${{ steps.identity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/contents/.github/catter.yml?ref=$CONFIG_SHA" > "$STATE/config-response.json"
          python3 - "$STATE/config-response.json" "$STATE/config.yml" "$STATE/authority.json" <<'PY'
          import base64
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          source, output, authority = map(Path, sys.argv[1:])
          value = json.loads(source.read_text(encoding="utf-8"))
          if value.get("encoding") != "base64" or value.get("path") != ".github/catter.yml":
              raise SystemExit("invalid config response")
          data = base64.b64decode(re.sub(r"\s+", "", value["content"]), validate=True)
          if len(data) > 65536:
              raise SystemExit("config is too large")
          output.write_bytes(data)
          metadata = json.loads(authority.read_text(encoding="utf-8"))
          metadata["config_sha256"] = hashlib.sha256(data).hexdigest()
          authority.write_text(json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          ruby -ryaml - "$STATE/config.yml" <<'RUBY'
          config = YAML.safe_load(File.read(ARGV[0]), permitted_classes: [], aliases: false)
          abort "invalid config" unless config.is_a?(Hash) && config["version"] == 1
          abort "invalid agent" unless config["agent"] == {"provider"=>"opencode", "auth"=>"api-key", "model"=>"opencode/mimo-v2.5-free"}
          runner = config["runner"]
          abort "invalid runner" unless runner.is_a?(Hash) && runner["type"] == "github-hosted" && runner["labels"] == ["ubuntu-latest"]
          RUBY

      - name: Check provider key before Issue exposure
        id: key
        if: ${{ steps.config.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.opencode_api_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            printf 'missing\n' > "$STATE/provider-key"
            echo 'OPENCODE_API_KEY is missing; add it in repository Actions Secrets.' >&2
            exit 1
          fi
          python3 - > "$STATE/provider-env-before.json" <<'PY'
          import json
          import os
          import re
          names = {"GITHUB_TOKEN", "GH_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_TOKEN", "ACTIONS_RUNTIME_TOKEN"}
          ignored = {"OPENCODE_API_KEY", *names, "SSH_AUTH_SOCK", "GPG_AGENT_INFO"}
          other = sum(name not in ignored and bool(value) for name, value in os.environ.items() if re.search(r"(?i)(token|secret|key|password|credential|auth)", name))
          value = {"provider_key_present": bool(os.environ.get("OPENCODE_API_KEY")), "github_credential_present": any(os.environ.get(name) for name in names), "other_secret_like_env_count": other}
          print(json.dumps(value, sort_keys=True))
          raise SystemExit(int(value["github_credential_present"] or other > 0))
          PY
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          printf 'present\n' > "$STATE/provider-key"

      - name: Fetch bounded Issue evidence
        id: issue
        if: ${{ steps.key.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '{number,title,body}' > "$STATE/issue.json"
          python3 - "$STATE/issue.json" "$STATE/authority.json" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          issue, authority = map(Path, sys.argv[1:])
          value = json.loads(issue.read_text(encoding="utf-8"))
          metadata = json.loads(authority.read_text(encoding="utf-8"))
          if set(value) != {"number", "title", "body"} or value["number"] != metadata["issue_number"] or not isinstance(value["title"], str) or len(value["title"]) > 1024 or not isinstance(value["body"], (str, type(None))):
              raise SystemExit("invalid Issue")
          data = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
          if len(data) > 65536:
              raise SystemExit("Issue too large")
          metadata["issue_sha256"] = hashlib.sha256(data).hexdigest()
          authority.write_text(json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Run OpenCode with provider key only
        id: provider
        if: ${{ steps.issue.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.opencode_api_key }}
          OPENCODE_AUTO_SHARE: "false"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_PRUNE: "false"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_DISABLE_MODELS_FETCH: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"read":"allow","edit":"allow","write":"allow","glob":"allow","grep":"allow","bash":"allow","webfetch":"deny","websearch":"deny","task":"deny","todowrite":"deny","skill":"deny","mcp":"deny"},"compaction":{"auto":true,"prune":true},"provider":{"opencode":{"options":{"timeout":1800000,"headerTimeout":1800000,"chunkTimeout":1800000}}}}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          python3 - "$STATE/issue.json" "$STATE/prompt.txt" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          issue = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          title = issue.get("title", "")
          body = issue.get("body", "")
          prompt = (
              f"Implement the requested feature or fix in the workspace files according to the issue description below.\n\n"
              f"Issue #{issue.get('number', '')}: {title}\n\n"
