              write("failure", "provider_patch_schema")
              raise SystemExit(0)
          protected = lambda name: name == ".git" or name == ".catter.yml" or name.startswith((".git/", ".github/"))
          safe_path = lambda name: isinstance(name, str) and 0 < len(name) <= 255 and not name.startswith("/") and "\\" not in name and ".." not in Path(name).parts and not protected(name)
          if not all(safe_path(name) for name in changed_files):
              write("failure", "provider_patch_protected_path")
              raise SystemExit(0)
          if patch_meta.get("symlink_or_submodule") or patch_meta.get("protected_paths") or patch_meta.get("untracked_files", 0) != 0:
              write("failure", "provider_patch_unsafe_metadata")
              raise SystemExit(0)
          branch = ""
          existing_pr_number = os.environ.get("EXISTING_PR_NUMBER", "").strip()
          existing_pr_branch = os.environ.get("EXISTING_PR_BRANCH", "").strip()
          existing_pr_head_sha = os.environ.get("EXISTING_PR_HEAD_SHA", "").strip()
          is_valid_existing_pr = bool(
              existing_pr_number and re.fullmatch(r"^[1-9][0-9]*$", existing_pr_number) and
              existing_pr_branch and re.fullmatch(rf"catter/implement/issue-{issue_number}-[0-9a-f]{{16}}", existing_pr_branch) and
              existing_pr_head_sha and re.fullmatch(r"^[0-9a-f]{40}$", existing_pr_head_sha)
          )
          if patch_meta["present"]:
              if not patch_meta["safe"] or not changed_files or len(patch) > 65536 or not patch_meta.get("sha256") or hashlib.sha256(patch).hexdigest() != patch_meta["sha256"]:
                  write("failure", "provider_patch_invalid")
                  raise SystemExit(0)
              if existing_pr_branch and re.fullmatch(rf"catter/implement/issue-{issue_number}-[0-9a-f]{{16}}", existing_pr_branch):
                  branch = existing_pr_branch
              else:
                  branch = f"catter/implement/issue-{issue_number}-" + hashlib.sha256(f"{request_id}:{issue_number}".encode()).hexdigest()[:16]
          elif patch or changed_files or patch_meta.get("sha256") is not None or patch_meta.get("bytes") != 0:
              write("failure", "provider_patch_unexpected")
              raise SystemExit(0)
          validated.write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          state = Path(os.environ.get("STATE", "/tmp/catter-implement-adapter"))
          (state / "should-mutate").write_text("1\n" if (patch_meta["present"] and branch) else "0\n", encoding="utf-8")
          (state / "branch").write_text(branch + "\n", encoding="utf-8")
          if not patch_meta["present"]:
              if is_valid_existing_pr:
                  write("success", None, branch=existing_pr_branch, pr=int(existing_pr_number), head_sha=existing_pr_head_sha)
              else:
                  write("success", "no_diff")
          PY
          exit 0

      - name: Resolve adapter authority
        id: authority
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat "$STATE/should-mutate" 2>/dev/null)" != 1 ]]; then exit 0; fi
          repo=$(gh api "repos/$REPOSITORY" --jq '{id,full_name,default_branch}') || exit 1
          base_branch=$(printf '%s' "$repo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["default_branch"])')
          base_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/$base_branch" --jq '.object.sha') || exit 1
          repo_id=$(printf '%s' "$repo" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          [[ "$repo_id" == "$REPOSITORY_ID" && "$base_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          python3 - "$STATE/validated.json" "$base_branch" "$base_sha" <<'PY'
          import json
          import re
          import sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("base_branch") != sys.argv[2] or result.get("base_sha") != sys.argv[3] or not re.fullmatch(r"[0-9a-f]{40}", result.get("base_sha", "")):
              raise SystemExit("provider base identity changed")
          PY
          gh api "repos/$REPOSITORY/contents/.github/catter.yml?ref=$CONFIG_SHA" > "$STATE/config-response.json" || exit 1
          python3 - "$STATE/config-response.json" "$STATE/validated.json" <<'PY'
          import base64
          import hashlib
          import json
          import re
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          result = json.load(open(sys.argv[2], encoding="utf-8"))
          if value.get("encoding") != "base64" or value.get("path") != ".github/catter.yml":
              raise SystemExit("invalid captured config")
          data = base64.b64decode(re.sub(r"\s+", "", value.get("content", "")), validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != result.get("config_sha256"):
              raise SystemExit("captured config changed")
          PY
          printf 'base_sha=%s\nbase_branch=%s\n' "$base_sha" "$base_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout exact adapter base
        if: ${{ steps.authority.outcome == 'success' && steps.authority.outputs.base_sha != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.authority.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Apply safe diff and publish ordinary Draft PR
        id: mutate
        if: ${{ steps.authority.outcome == 'success' && steps.authority.outputs.base_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_PR_NUMBER: ${{ inputs.existing_pr_number }}
          EXISTING_PR_BRANCH: ${{ inputs.existing_pr_branch }}
