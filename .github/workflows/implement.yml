          except (OSError, ValueError, RuntimeError, subprocess.SubprocessError) as error:
              code = str(error)
              allowed = {"checkout", "patch_check", "patch_integrity", "patch_leakage", "patch_schema", "patch_protected_path", "patch_paths", "patch_mode", "branch_divergence", "branch_schema", "branch_changed", "patch_apply", "staged_patch_changed", "commit", "non_fast_forward", "pr_scan_bound", "duplicate_pull_request", "pr_create_response", "github_bound", "head_drift", "pr_not_found", "pr_closed_or_merged", "pr_identity_changed"}
              finish("failure", code if code in allowed else "adapter_failed")
          finally:
              os.environ.pop("GH_TOKEN", None)
          PY
          unset GH_TOKEN

      - name: Report authority or adapter failure
        if: ${{ always() }}
        env:
          AUTHORITY_OUTCOME: ${{ steps.authority.outcome }}
        shell: bash
        run: |
          set +e
          python3 - "$FINAL" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          if os.environ.get("AUTHORITY_OUTCOME") == "success":
              raise SystemExit(0)
          state = Path(os.environ.get("STATE", "/tmp/catter-implement-adapter"))
          try:
              should_mutate = (state / "should-mutate").read_text(encoding="utf-8").strip()
          except (OSError, UnicodeError):
              should_mutate = ""
          if should_mutate != "1":
              raise SystemExit(0)
          path = Path(sys.argv[1])
          try:
              value = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              value = {}
          if not isinstance(value, dict):
              value = {}
          value.update({"status": "failure", "pr_number": None, "head_branch": None, "head_sha": None, "branch": "", "error_code": "adapter_authority"})
          path.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload final implementation result only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catter-implementation-final-${{ inputs.request_id }}
          path: ${{ env.FINAL }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean adapter workspace and credential variables
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          unset GH_TOKEN GITHUB_TOKEN
          rm -rf "$DOWNLOAD" "$STATE"
